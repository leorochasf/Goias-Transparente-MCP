[project]
name = "goias-transparente-mcp"
version = "0.6.0"
description = "Consulta o Portal da Transparência de municípios (plataforma NucleoGov) por MCP, linha de comando ou biblioteca."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "transparencia", "portal-da-transparencia", "nucleogov", "dados-abertos", "lai", "municipios",
            "tcm-go"]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
pdf = ["pypdf>=4"]  # ler_acordao_tcm: texto do PDF do acórdão
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6", "pypdf>=4"]

[project.scripts]
goias-transparente = "transparencia_municipal.cli:main"
goias-transparente-mcp = "transparencia_municipal.servidor_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["transparencia_municipal*"]

[tool.setuptools.package-data]
transparencia_municipal = ["catalogo_go.json"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # fixo: versões novas do ruff ligam outras regras por padrão
ignore = ["E702"]  # a CLI declara argumentos aos pares, numa linha só, de propósito

[tool.pytest.ini_options]
markers = [
    "ao_vivo: consulta o portal real; roda só com TRANSPARENCIA_AO_VIVO=1",
    "descobre_sufixos: o Portal aprende os sufixos na página inicial (simulada)",
]
